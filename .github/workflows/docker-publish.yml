# 构建并发布 Docker 镜像到 GitHub Container Registry (ghcr.io)
#
# 为什么需要这个：NAS、软路由这类设备上本地 `docker compose build` 要跑
# npm ci + vite build + pip 编译 + 下载 Chromium，CPU 会长时间打满，
# 内存不够时直接 OOM，表现为"部署不上、机器卡死"。
# 有了预构建镜像，这些设备只需要 pull，几分钟就能起来。
#
# 发布后镜像地址：ghcr.io/<owner>/xianyu-super-butler:latest
# 首次发布后需要到仓库 Packages 页面把镜像设为 Public，否则 pull 需要登录。

name: Publish Docker image

# 只在打版本 tag 或手动触发时构建：推 main 只更新代码，不发镜像，
# 避免每次提交都跑一次多架构构建（Actions 时长和镜像存储都很贵）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 交叉编译 arm64 需要，飞牛等 NAS 有一部分是 ARM 机型
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # fork 版本号用 上游版本+内部号（如 v3.3.0+1）。Docker tag 不允许 '+'，
      # 构建时统一换成 '-'：git tag v3.3.0+1 → 镜像 3.3.0-1 / v3.3.0-1 / latest。
      - name: Sanitize release tag for Docker
        id: release_tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          safe="${tag//+/-}"
          echo "safe=${safe}" >> "$GITHUB_OUTPUT"
          echo "version=${safe#v}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.release_tag.outputs.safe }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.release_tag.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
